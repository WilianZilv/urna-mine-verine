<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="Painel ao vivo da Bolsa da vila: tickers fictícios, índice IVILA e circuit breaker. Moedas 100% fictícias.">
<meta name="theme-color" content="#0d0519">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://urna-mine-verine.wilianzilv.workers.dev/embed/bolsa.html">
<meta property="og:title" content="BOLSA DA VILA - URNA-MINE-VERINE">
<meta property="og:description" content="Painel ao vivo da Bolsa da vila: tickers fictícios, índice IVILA e circuit breaker. Moedas 100% fictícias.">
<meta property="og:image" content="https://urna-mine-verine.wilianzilv.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>BOLSA DA VILA - URNA-MINE-VERINE</title>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.className = "light";</script>
<style>
    :root { --bg: #0d0519; --panel: #160a2b; --line: #3a1d66; --fg: #e8dcff; --dim: #8f7bb8; --up: #39ff88; --down: #ff3b6b; --accent: #ff2bd6; --glow: 0 0 6px; }
    :root.light { --bg: #fbf8ff; --panel: #efe6ff; --line: #cdb8f0; --fg: #1d0f38; --dim: #6b5a8e; --up: #00994d; --down: #d6003a; --accent: #b0008f; --glow: 0 0 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.3 ui-monospace, Consolas, "Courier New", monospace; overflow: hidden; }
    body { display: flex; flex-direction: column; border: 1px solid var(--line); }
    header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 14px; letter-spacing: 2px; color: var(--accent); text-shadow: var(--glow) var(--accent); }
    #ix { margin-left: auto; font-weight: bold; }
    #mood { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
    #mood.up { background: var(--up); box-shadow: var(--glow) var(--up); }
    #mood.down { background: var(--down); box-shadow: var(--glow) var(--down); }
    #alert { display: none; padding: 4px 10px; font-weight: bold; color: #000; background: var(--down); }
    #alert.up { background: var(--up); }
    #board { flex: 1; overflow: hidden; padding: 4px 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 14px; align-content: start; }
    .row { display: grid; grid-template-columns: 1fr auto 4.5em; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); white-space: nowrap; }
    .row span + span { text-align: right; }
    .s { font-weight: bold; }
    .up { color: var(--up); text-shadow: var(--glow) var(--up); }
    .down { color: var(--down); text-shadow: var(--glow) var(--down); }
    #tape { overflow: hidden; white-space: nowrap; background: var(--panel); border-top: 1px solid var(--line); padding: 4px 0; }
    #tape span { display: inline-block; padding-left: 100%; animation: tape 30s linear infinite; }
    @keyframes tape { to { transform: translateX(-100%); } }
    footer { display: flex; justify-content: space-between; padding: 3px 10px; color: var(--dim); font-size: 11px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) {
        #tape span { animation: none; padding-left: 10px; }
    }
</style>
</head>
<body>
<header><span id="mood"></span><h1>BOLSA DA VILA</h1><span id="ix">--</span></header>
<div id="alert"></div>
<div id="board"><div class="row"><span>carregando pregao...</span></div></div>
<div id="tape"><span id="tapetxt">moedas ficticias - nada aqui e conselho financeiro</span></div>
<footer><span id="st">conectando</span><a id="play" href="/" target="_blank" rel="noopener">jogar na vila &gt;</a></footer>
<script>
(() => {
    const q = new URLSearchParams(location.search);
    let api = "";
    try { if (q.get("api")) api = new URL(q.get("api")).origin; } catch (e) { }
    document.getElementById("play").href = (api || "") + "/";
    const $ = (id) => document.getElementById(id);
    const cls = (d) => (d > 0 ? "up" : d < 0 ? "down" : "");
    const pct = (d) => (d > 0 ? "+" : "") + d.toFixed(1) + "%";
    const el = (tag, c, t) => { const e = document.createElement(tag); if (c) e.className = c; e.textContent = t; return e; };

    function render(w) {
        const b = w.bolsa;
        if (!b || !b.tickers || !b.tickers.length) { $("st").textContent = "pregao fechado"; return; }
        $("ix").textContent = "IVILA " + pct(b.ix || 0);
        $("ix").className = cls(b.ix || 0);
        $("mood").className = b.mood > 0 ? "up" : b.mood < 0 ? "down" : "";
        $("alert").style.display = b.alert ? "block" : "none";
        $("alert").className = b.mood > 0 ? "up" : "";
        $("alert").textContent = b.alert || "";
        const rows = b.tickers.map(([s, p, d]) => {
            const r = el("div", "row");
            r.append(el("span", "s", s), el("span", "", p.toFixed(2)), el("span", cls(d), pct(d)));
            return r;
        });
        $("board").replaceChildren(...rows);
        $("tapetxt").textContent = b.tickers.map(([s, p, d]) => `${s} ${p.toFixed(2)} ${d > 0 ? "\u25B2" : d < 0 ? "\u25BC" : "="}${Math.abs(d).toFixed(1)}%`).join("   |   ") + "   |   moedas ficticias";
        $("st").textContent = `${w.online || 0} online - ${new Date(w.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}`;
    }

    async function poll() {
        try {
            const r = await fetch(api + "/api/world");
            if (!r.ok) throw new Error(r.status);
            render(await r.json());
        } catch (e) {
            $("st").textContent = "sinal fraco, tentando de novo";
        }
    }
    poll();
    setInterval(poll, 15000);
})();
</script>
</body>
</html>
