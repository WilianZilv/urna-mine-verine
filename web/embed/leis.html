<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="description" content="Leis aprovadas pelos players no Congresso da vila satírica URNA-MINE-VERINE, ao vivo.">
<meta name="theme-color" content="#0d0519">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://urna-mine-verine.wilianzilv.workers.dev/embed/leis.html">
<meta property="og:title" content="LEIS EM VIGOR - URNA-MINE-VERINE">
<meta property="og:description" content="Leis aprovadas pelos players no Congresso da vila satírica URNA-MINE-VERINE, ao vivo.">
<meta property="og:image" content="https://urna-mine-verine.wilianzilv.workers.dev/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>LEIS EM VIGOR - URNA-MINE-VERINE</title>
<script>if (new URLSearchParams(location.search).get("theme") === "light") document.documentElement.className = "light";</script>
<style>
    :root { --bg: #0d0519; --panel: #160a2b; --line: #3a1d66; --fg: #e8dcff; --dim: #8f7bb8; --accent: #ffd23d; --bar: #39ff88; --glow: 0 0 6px; }
    :root.light { --bg: #fbf8ff; --panel: #efe6ff; --line: #cdb8f0; --fg: #1d0f38; --dim: #6b5a8e; --accent: #8a5a00; --bar: #00994d; --glow: 0 0 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.3 ui-monospace, Consolas, "Courier New", monospace; overflow: hidden; }
    body { display: flex; flex-direction: column; border: 1px solid var(--line); }
    header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 14px; letter-spacing: 2px; color: var(--accent); text-shadow: var(--glow) var(--accent); }
    #cnt { margin-left: auto; color: var(--dim); font-size: 11px; }
    main { flex: 1; overflow: hidden; padding: 6px 10px; display: flex; flex-direction: column; gap: 8px; }
    .law { border: 1px solid var(--line); background: var(--panel); padding: 6px 8px; }
    .top { display: flex; justify-content: space-between; gap: 8px; font-weight: bold; }
    .t { color: var(--bar); text-shadow: var(--glow) var(--bar); font-variant-numeric: tabular-nums; }
    .d { color: var(--dim); font-size: 12px; margin: 2px 0 5px; }
    .bar { height: 4px; background: var(--line); }
    .bar i { display: block; height: 100%; background: var(--bar); box-shadow: var(--glow) var(--bar); transition: width 1s linear; }
    .empty { margin: auto; text-align: center; color: var(--dim); }
    .empty b { display: block; color: var(--fg); margin-bottom: 4px; }
    footer { display: flex; justify-content: space-between; padding: 3px 10px; color: var(--dim); font-size: 11px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) {
        .bar i { transition: none; }
    }
</style>
</head>
<body>
<header><h1>LEIS EM VIGOR</h1><span id="cnt"></span></header>
<main id="list"><div class="empty">abrindo a sessao...</div></main>
<footer><span id="st">conectando</span><a id="play" href="/" target="_blank" rel="noopener">votar na vila &gt;</a></footer>
<script>
(() => {
    const q = new URLSearchParams(location.search);
    let api = "";
    try { if (q.get("api")) api = new URL(q.get("api")).origin; } catch (e) { }
    document.getElementById("play").href = (api || "") + "/";
    const $ = (id) => document.getElementById(id);
    const el = (tag, c, t) => { const e = document.createElement(tag); if (c) e.className = c; if (t != null) e.textContent = t; return e; };
    const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    let laws = [];

    function tick() {
        const now = Date.now();
        for (const l of laws) {
            const s = Math.max(0, Math.round((l.end - now) / 1000));
            l.t.textContent = s ? mmss(s) : "expirou";
            l.i.style.width = `${Math.min(100, (100 * s) / l.max)}%`;
        }
    }

    function render(w) {
        const now = Date.now();
        laws = (w.laws || []).filter((l) => l.left > 0).sort((a, b) => a.left - b.left).map((l) => {
            const box = el("div", "law"), top = el("div", "top"), t = el("span", "t"), bar = el("div", "bar"), i = el("i");
            top.append(el("span", "", l.n), t);
            bar.append(i);
            box.append(top, el("div", "d", l.d), bar);
            return { box, t, i, end: now + l.left * 1000, max: Math.max(300, l.left) };
        });
        $("cnt").textContent = `${laws.length} aprovada(s)`;
        if (laws.length) $("list").replaceChildren(...laws.map((l) => l.box));
        else {
            const e = el("div", "empty");
            e.append(el("b", "", "nenhuma lei em vigor"), "a vila ta literalmente sem lei. vota com /lei no jogo");
            $("list").replaceChildren(e);
        }
        tick();
        $("st").textContent = `${w.online || 0} deputado(s) online`;
    }

    async function poll() {
        try {
            const r = await fetch(api + "/api/world");
            if (!r.ok) throw new Error(r.status);
            render(await r.json());
        } catch (e) {
            $("st").textContent = "sinal fraco, tentando de novo";
        }
    }
    poll();
    setInterval(poll, 15000);
    setInterval(tick, 1000);
})();
</script>
</body>
</html>
