[package]
name = "urna_mine_verine"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", default-features = false }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.2"
tungstenite = { version = "0.28", features = ["native-tls"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
