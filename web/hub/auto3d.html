<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cubo - three.js com UMA tag do Urna (modo auto)</title>
    <style>html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2838; } p { position: absolute; left: 12px; top: 4px; color: #fff; font: 14px system-ui; }</style>
    <!-- a UNICA linha do Urna neste jogo: -->
    <script src="https://urna-mine-verine.wilianzilv.workers.dev/sdk/urna-portal.js" data-auto></script>
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
    <p>Jogo three.js qualquer: so tem a tag &lt;script data-auto&gt;. Os outros jogadores do Urna aparecem na cena sozinhos.</p>
    <script type="module">
        import * as THREE from "three";
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        document.body.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1b2838);
        const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 200);
        scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2));
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x2f6b4f }));
        const cube = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshLambertMaterial({ color: 0xff8a3d }));
        cube.position.set(0, 1.2, 0);
        scene.add(floor, cube, new THREE.GridHelper(60, 60, 0x88aa99, 0x446655));
        const fit = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
        addEventListener("resize", fit); fit();
        const a0 = Math.random() * Math.PI * 2;
        renderer.setAnimationLoop((t) => {
            const a = a0 + t / 9000;
            camera.position.set(6 + Math.cos(a) * 9, 1.7, 6.5 + Math.sin(a) * 9);
            camera.lookAt(6, 1, 6.5);
            cube.rotation.y = t / 1000;
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
